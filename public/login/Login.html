<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ingrain</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="background"></div>
    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form id="signupForm">
                <h1>Create Account</h1>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
                <select name="role" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="farmer">Farmer</option>
                    <option value="consumer">Consumer</option>
                </select>
                <button type="submit">Sign Up</button>
                <p>Already have an account? <a href="#" id="switchToSignin">Sign In</a></p>
            </form>
        </div>
        <div class="form-container sign-in-container">
            <form id="signinForm">
                <h1>Sign In</h1>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <a href="/forgot-password">Forgot your password?</a>
                <button type="submit">Sign In</button>
                <p>New here? <a href="#" id="switchToSignup">Sign Up</a></p>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <h1>Welcome to Ingrain!</h1>
                <p>Connecting farmers and consumers directly.</p>
                <button id="toggleForm">Switch to Sign Up / Sign In</button>
            </div>
        </div>
    </div>
    <div id="message" style="display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px; background: #4CAF50; color: white; border-radius: 5px;"></div>

    <script>
        const container = document.getElementById('container');
        const signupForm = document.getElementById('signupForm');
        const signinForm = document.getElementById('signinForm');
        const messageDiv = document.getElementById('message');

        document.getElementById('switchToSignup').addEventListener('click', () => container.classList.add('slide'));
        document.getElementById('switchToSignin').addEventListener('click', () => container.classList.remove('slide'));
        document.getElementById('toggleForm').addEventListener('click', () => container.classList.toggle('slide'));

        function showMessage(text, isError) {
            messageDiv.textContent = text;
            messageDiv.style.background = isError ? '#f44336' : '#4CAF50';
            messageDiv.style.display = 'block';
            setTimeout(() => messageDiv.style.display = 'none', 5000);
        }

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(signupForm);
            const jsonData = Object.fromEntries(formData);

            if (jsonData.password !== jsonData.confirmPassword) {
                showMessage("Passwords don't match", true);
                return;
            }

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });
                const data = await response.json();
                showMessage(data.message, !response.ok);
                if (response.ok) {
                    signupForm.reset();
                    container.classList.remove('slide');
                }
            } catch (error) {
                showMessage('Network error during sign-up', true);
            }
        });

        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(signinForm);
            const jsonData = Object.fromEntries(formData);
            console.log('Form data submitted:', jsonData); // Debug log

            if (!jsonData.email || !jsonData.password) {
                showMessage("Email and password are required", true);
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(jsonData)
                });
                const data = await response.json();
                showMessage(data.message, !response.ok);
                console.log('Login response:', data); // Debug log

                if (response.ok) {
                    localStorage.setItem('token', data.token || '');
                    localStorage.setItem('userId', data.userId || '');
                    localStorage.setItem('role', data.role || '');
                    signinForm.reset();
                    window.location.href = data.role === 'farmer' ? '/farmer' : '/consumer';
                }
            } catch (error) {
                showMessage('Network error during sign-in', true);
                console.error('Login error:', error);
            }
        });
    </script>

</body>
</html>
