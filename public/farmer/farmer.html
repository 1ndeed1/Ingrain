<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Dashboard | Ingrain</title>
    <link rel="stylesheet" href="farmer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="profile-header">
                <img id="profilePhoto" src="/uploads/default.jpg" alt="Profile Photo">
                <h3 id="profileName">Loading...</h3>
            </div>
            <nav>
                <button class="nav-btn" data-section="profile"><i class="fas fa-user"></i> Profile</button>
                <button class="nav-btn" data-section="crops"><i class="fas fa-seedling"></i> Crops</button>
                <button class="nav-btn" data-section="orders"><i class="fas fa-shopping-cart"></i> Orders</button>
                <button class="nav-btn" data-section="analytics"><i class="fas fa-chart-line"></i> Analytics</button>
                <button class="nav-btn" data-section="messages"><i class="fas fa-envelope"></i> Messages</button>
            </nav>
            <button id="logoutBtn" class="btn-primary logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h1>Your Dashboard</h1>
            </header>
            <section id="content" class="container">
                <!-- Dynamic content will be injected here -->
            </section>
        </main>
    </div>
    <script src="/farmer/farmer.js"></script>
</body>
</html>
