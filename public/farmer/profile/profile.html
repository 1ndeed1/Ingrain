<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Profile Setup - Ingrain</title>
    <link rel="stylesheet" href="/farmer/profile/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="main-header">
        <div class="container">
            <h1 class="logo">
                <i class="fas fa-tractor"></i> Ingrain
            </h1>
            <nav>
                <a href="/farmer/farmer.html">Dashboard</a>
                <button id="logoutBtn" class="btn-outline">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="profile-setup">
            <h2>Complete Your Profile</h2>
            <form id="profileForm" enctype="multipart/form-data">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="farmName">Farm Name:</label>
                <input type="text" id="farmName" name="farmName" required>

                <label for="location">Location (City/Region):</label>
                <input type="text" id="location" name="location" required>

                <label for="bio">Bio (Tell us about your farm):</label>
                <textarea id="bio" name="bio" rows="4"></textarea>

                <label for="contactNumber">Contact Number (Optional):</label>
                <input type="tel" id="contactNumber" name="contactNumber">

                <label for="profilePicture">Profile Picture (Optional):</label>
                <div id="currentProfilePicture" style="margin-bottom: 10px;">
                    <img id="currentImage" src="/uploads/default.jpg" alt="Current Profile Picture"
                        style="max-width: 100px;">
                </div>
                <input type="file" id="profilePicture" name="profilePicture" accept="image/*">

                <button type="submit">Save Profile</button>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>© 2025 Ingrain. All rights reserved.</p>
        </div>
    </footer>

    <script src="/farmer/profile/profile.js"></script>

</html>
