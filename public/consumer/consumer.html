<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Consumer Dashboard</title>
    <link rel="stylesheet" href="/consumer/consumer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="logo">
                <i class="fas fa-shopping-basket"></i> Ingrain
            </h1>
            <nav>
                <a href="#"><i class="fas fa-search"></i> Search</a>
                <a href="#"><i class="fas fa-shopping-cart"></i> Cart</a>
                <button id="logoutBtn" class="btn-outline">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="product-filters">
            <div class="search-bar">
                <input type="text" placeholder="Search produce...">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="filter-options">
                <select>
                    <option>Filter by Farmer</option>
                </select>
                <select>
                    <option>Price Range</option>
                </select>
            </div>
        </section>

        <section class="product-grid" id="productsContainer">
            <!-- Products will load here dynamically -->
            <div class="loader">
                <i class="fas fa-spinner fa-spin"></i> Loading fresh produce...
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2023 FreshHarvest. All rights reserved.</p>
        </div>
    </footer>

    <script src="/consumer/consumer.js"></script>
</body>
</html>
